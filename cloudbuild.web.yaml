steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_API_URL=${_NEXT_PUBLIC_AUTH_API_URL}'
      - '-t'
      - '${_IMAGE}'
      - '.'
images: ['${_IMAGE}']
