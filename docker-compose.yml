name: meetra

services:
  # API Gateway (Traefik)
  traefik:
    image: traefik:v3.0
    container_name: meetra-gateway
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--accesslog=true"
    ports:
      - "9080:80"
      - "8088:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - meetra-net

  postgres:
    image: postgres:16-alpine
    container_name: meetra-postgres
    environment:
      POSTGRES_USER: meetra
      POSTGRES_PASSWORD: meetra
      POSTGRES_DB: meetra
    ports:
      - "5432:5432"
    volumes:
      - meetra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetra -d meetra"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - meetra-net

  redis:
    image: redis:7-alpine
    container_name: meetra-redis
    ports:
      - "6379:6379"
    volumes:
      - meetra_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - meetra-net

  # Optional: DB admin UI (simple)
  adminer:
    image: adminer:latest
    container_name: meetra-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - meetra-net

networks:
  meetra-net:
    driver: bridge

volumes:
  meetra_pgdata:
  meetra_redisdata:
